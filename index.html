<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>화물연대 울산지역본부 간부들의 선택, 2번</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--bg:#fff1e2;--ink:#4a1f0c;--mute:#8a5a42;--org:#b84a0a;--org2:#8f3705;--gold:#f6b21a;--card:#fffaf4;--line:#efcfb2;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1009;--ink:#ffe9d4;--mute:#d2a888;--org:#e0671f;--org2:#b84a0a;--card:#2a180d;--line:#4a2a18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1009;--ink:#ffe9d4;--mute:#d2a888;--org:#e0671f;--org2:#b84a0a;--card:#2a180d;--line:#4a2a18;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans KR",system-ui,sans-serif}
.hero{background:var(--org2);color:#fff;padding:56px 24px 40px;position:relative;overflow:hidden}
.hero-in{max-width:1040px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
h1{font:400 clamp(30px,5.4vw,56px)/1.18 "Black Han Sans","Noto Sans KR",sans-serif;margin:0;max-width:16ch}
.big{font:400 clamp(120px,24vw,260px)/.82 "Black Han Sans","Noto Sans KR",sans-serif;color:var(--gold);transform:skew(-8deg);text-shadow:6px 6px 0 rgba(0,0,0,.28)}
.slogan{max-width:1040px;margin:0 auto;padding:28px 24px 8px;font-size:clamp(18px,2.6vw,24px);font-weight:700}
.slogan b{font-family:"Black Han Sans",sans-serif;font-weight:400;color:var(--org);font-size:1.25em}
main{max-width:1040px;margin:0 auto;padding:8px 24px 64px}
.tabs{display:flex;gap:8px;margin:24px 0 8px;flex-wrap:wrap}
.tab{font:700 16px "Noto Sans KR",sans-serif;padding:12px 18px;border:2px solid var(--org);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--org);color:#fff}
.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tab small{font-weight:400;opacity:.85;margin-left:6px}
h2{font:400 clamp(24px,3.6vw,34px)/1.25 "Black Han Sans","Noto Sans KR",sans-serif;margin:22px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;list-style:none;padding:0;margin:0}
.card{background:var(--card);border:2px solid var(--org);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:6/7;object-fit:cover;display:block;background:var(--line)}
.card div{background:var(--org);color:#fff;padding:7px 6px 8px;text-align:center;line-height:1.25}
.card span{display:block;font-size:12px;opacity:.9}
.card b{font-size:19px}
footer{background:var(--org2);color:#fff;padding:36px 24px calc(36px + env(safe-area-inset-bottom,0px));text-align:center}
footer p{margin:0 auto;max-width:1040px}
footer .k{font:400 clamp(26px,5vw,44px)/1.3 "Black Han Sans","Noto Sans KR",sans-serif}
footer .k em{font-style:normal;color:var(--gold)}
footer small{display:block;margin-top:10px;opacity:.85}
.hero-in{align-items:center;justify-content:center}
.hero-poster{width:min(100%,440px);height:auto;display:block;border:4px solid var(--gold);border-radius:6px;box-shadow:8px 8px 0 rgba(0,0,0,.3)}
.hero-txt{flex:1 1 320px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;list-style:none;padding:0;margin:0 0 20px}
.posters button{all:unset;cursor:zoom-in;display:block;width:100%;border:2px solid var(--org);border-radius:4px;overflow:hidden;background:var(--card)}
.posters button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.posters img{width:100%;height:auto;display:block}
.posters span{display:block;background:var(--org);color:#fff;text-align:center;padding:6px;font-weight:700;font-size:14px}
.vote{border-left:6px solid var(--org);background:var(--card);padding:14px 18px;margin:0 0 36px;border-radius:0 6px 6px 0}
.vote b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:20px;color:var(--org)}
dialog{border:0;padding:0;background:transparent;max-width:min(94vw,560px);max-height:94vh}
dialog::backdrop{background:rgba(0,0,0,.78)}
dialog img{width:100%;max-height:94vh;object-fit:contain;display:block;cursor:zoom-out}
.nm{margin:4px 0 0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 8px}
.ki{font-style:normal;font-weight:700;font-size:19px;line-height:1.3;background:var(--gold);color:#4a1f0c;padding:1px 9px;border-radius:4px;white-space:nowrap}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header class="hero"><div class="hero-in"><img class="hero-poster" id="hp" alt="울주지부장 후보 기호 2번 김용호 포스터" title="누르면 크게 볼 수 있어요"><div class="hero-txt"><h1>화물연대 울산지역본부 간부들의 선택,</h1><div class="big" aria-label="기호 2번">2번</div></div></div></header>
<p class="slogan">업종을 넘어 서로 다른 현장에서 활동하고 있는 후보들이 하나로 모여, <b>기호 2번 김수범/김범수/김용호/이준서</b> 후보와 함께합니다.</p>
<main>
